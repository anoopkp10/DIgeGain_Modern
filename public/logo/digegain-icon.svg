      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="45%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <linearGradient id="gOrangeMid" x1="0%" y1="0%" x2="100%" y2="100%">
