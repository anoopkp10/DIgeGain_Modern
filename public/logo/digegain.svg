<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Top Orange Swirl Gradient -->
    <linearGradient id="orangeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="60%" stop-color="#F7941D" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <!-- Blue Swirl Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="50%" stop-color="#1E8FCC" />
      <stop offset="100%" stop-color="#0277BD" />
    </linearGradient>
    <!-- Green Swirl Gradient -->
    <linearGradient id="greenGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="50%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <!-- Yellow Ribbon Accent -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <!-- Wordmark Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E8FCC" />
      <stop offset="100%" stop-color="#29B6F6" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Swirling Ribbon Globe -->
  <g transform="translate(200, 165)">
    <!-- Top Yellow/Amber Tip Ribbon -->
    <path d="M -30 -90 C -10 -95, 20 -92, 45 -78 C 30 -70, 10 -75, -20 -72 C -32 -76, -38 -84, -30 -90 Z" fill="url(#yellowGrad)" />
    
    <!-- Top-Mid Orange Main Ribbon -->
    <path d="M -75 -48 C -70 -72, -35 -92, 15 -88 C 65 -82, 85 -50, 75 -22 C 60 -12, 40 -20, 20 -28 C -25 -45, -55 -40, -75 -48 Z" fill="url(#orangeGrad)" />
    
    <!-- Upper Blue Ribbon Arch -->
    <path d="M -85 -10 C -85 -30, -50 -55, 10 -52 C 60 -50, 92 -20, 95 15 C 80 18, 55 10, 25 -2 C -20 -18, -60 -5, -85 -10 Z" fill="url(#blueGrad)" />
    
    <!-- Center Royal Blue Sweeping Band -->
    <path d="M -92 18 C -90 -2, -60 -25, -10 -22 C 45 -18, 88 5, 96 35 C 75 42, 35 30, -15 15 C -55 5, -80 20, -92 18 Z" fill="#1565C0" />
    
    <!-- Vibrant Emerald-Green Rising Ribbon -->
    <path d="M -80 45 C -65 20, -20 5, 30 18 C 75 30, 95 62, 70 85 C 50 82, 20 68, -25 50 C -55 38, -75 48, -80 45 Z" fill="url(#greenGrad)" />
    
    <!-- Lower Leaf Accent Ribbon -->
    <path d="M -50 78 C -25 65, 15 62, 55 75 C 62 82, 45 92, 10 90 C -25 88, -45 84, -50 78 Z" fill="#66BB6A" />
  </g>

  <!-- Wordmark "DIGEGAIN" -->
  <text x="200" y="325"
        text-anchor="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
        font-weight="800"
        font-size="44"
        letter-spacing="2.5"
        fill="url(#textGrad)">DIGEGAIN</text>
</svg>
